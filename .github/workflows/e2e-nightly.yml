name: E2E nightly

# The full Playwright suite (app/e2e) on master every night, on the built site with the real relay. Pull requests
# run only the smoke subset (ci.yml, e2e-smoke), so this is what catches a spec drifting from the app.
on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC, after the Pacific evening's merges
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
          save-if: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build WebAssembly engine
        run: scripts/build-wasm.sh
        env:
          LEGATUM_PLAYTEST_PROFILE: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-pkg
          path: app/src/wasm-pkg
          retention-days: 1

  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }} of 4)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            infra/relay/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: app/src/wasm-pkg
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install app and relay dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix infra/relay
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Build the site for the local relay
        run: scripts/build-web.sh --skip-wasm
        env:
          LEGATUM_RELAY_URL: http://127.0.0.1:8787
      - name: Full browser suite (shard ${{ matrix.shard }} of 4)
        run: npx playwright test --trace off --reporter=list --shard=${{ matrix.shard }}/4
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: app/test-results
          retention-days: 7
